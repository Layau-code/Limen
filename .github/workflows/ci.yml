name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: 检查格式、静态分析和竞态
        run: make check
      - name: 验证 PostgreSQL 多实例不变量
        run: make integration
      - name: 构建二进制
        run: make build
      - name: 冒烟测试
        run: make smoke
