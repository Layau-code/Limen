name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: 执行离线 RC 发布门禁
        run: make release-check
      - name: 说明真实 Provider 联调边界
        run: echo 'CI 不读取 Provider Key；发布候选需在受保护环境手动运行 make release-live'
